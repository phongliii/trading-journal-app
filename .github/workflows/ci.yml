# Runs the tests and a production build on every pull request and every push
# to main, so a PR shows ✓ / ✕ before it's merged and a broken build never
# reaches Vercel (which deploys main on its own — this doesn't deploy).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button on the Actions tab, to run it by hand

# A newer push to the same PR/branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
